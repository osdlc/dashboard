# A plugin package: this file plus the plugin's own files. See docs/plugins.md.
id: containers
version: 0.1.0
name: Containers and VMs
description: >-
  Container runtimes on this machine in one tile: Colima and Lima VMs (and
  Podman machines), every Docker context with whether its engine answers, and
  the containers on each engine. Each CLI is optional: one that is not
  installed is skipped, one that fails shows an error row. Set a program
  setting to "" or false to turn that source off.
tags: [containers, docker, colima, lima, podman, vm, ops, local]
# Run in this folder.
run: [python3, main.py]
runtime: python3>=3.9
# Each is optional; a missing one is skipped.
binaries: [docker, colima, limactl, podman]
size: wide
config_schema:
  type: object
  additionalProperties: false
  properties:
    show_exited: { type: boolean, description: "Also list containers that are not running (docker ps -a). Default false." }
    show_stopped_vms: { type: boolean, description: "Also list VMs that are stopped. Default true." }
    limit: { type: integer, minimum: 0, description: "Container rows shown. Default 30." }
    timeout: { type: number, description: "Seconds each CLI call may take. Default 4." }
    docker: { type: [string, boolean], description: 'The docker program, e.g. a full path. "" or false turns the Docker engines and containers off. Default docker.' }
    limactl: { type: [string, boolean], description: 'The limactl program. "" or false turns Lima VMs off. Default limactl.' }
    colima: { type: [string, boolean], description: 'The colima program. "" or false turns Colima VMs off. Default colima.' }
    podman: { type: [string, boolean], description: 'The podman program. "" or false turns Podman machines off. Default podman.' }
