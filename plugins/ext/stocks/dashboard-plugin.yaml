# A plugin package: this file plus the plugin's own files. See docs/plugins.md.
id: stocks
version: 0.1.0
name: Stocks
description: >-
  Prices and the change since the previous close of the symbols you pick, from
  Yahoo Finance. Warns when a symbol falls at
  least a set percent, or a symbol is not found. Click a row to open it on
  Yahoo Finance. Uses Yahoo's unofficial chart endpoint, no key, and can break
  without notice.
tags: [finance, stocks, prices, public-api]
run: [python3, main.py]
runtime: python3>=3.9
hosts: [query1.finance.yahoo.com]
size: medium
config_schema:
  type: object
  additionalProperties: false
  properties:
    symbols:
      type: array
      items: { type: string }
      minItems: 1
      maxItems: 25
      description: 'Ticker symbols as Yahoo Finance writes them, e.g. AAPL, BRK-B, ^GSPC, EURUSD=X. Shown in this order. Default [SPY, QQQ, AAPL, MSFT, NVDA].'
    warn_drop: { type: number, exclusiveMinimum: 0, description: "Warn when a symbol fell at least this many percent since the previous close. Default 2." }
    sample:
      type: [string, "null"]
      x-path: true
      description: 'Read saved replies instead of calling Yahoo: a file (one reply) or a folder with one SYMBOL.json per symbol. For tests and demos.'
    timeout: { type: number, minimum: 1, maximum: 60, description: "Seconds to wait for each request. Default 10." }
