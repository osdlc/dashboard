id: latency
version: 0.1.0
name: Network latency
description: >-
  The time to open a TCP connection to each target, as a live chart. Turns
  yellow when a target is slow and red when it is down. No ping privileges needed.
tags: [example, network, monitoring, local]
run: [python3, latency.py]
runtime: python3>=3.9
hosts: [the targets you set]
size: wide
config_schema:
  type: object
  additionalProperties: false
  required: [targets]
  properties:
    slow_ms: { type: number, description: Slower than this is a warning. }
    history: { type: integer, minimum: 2, description: Points kept per target. }
    targets:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [name, host]
        properties:
          name: { type: string }
          host: { type: string }
          port: { type: integer, minimum: 1, maximum: 65535 }
demo:
  status: warn
  summary: github 38ms · dns 12ms · office vpn 212ms
  root:
    type: column
    children:
      - type: row
        children:
          - { type: stat, label: github, value: "38", unit: ms, status: ok }
          - { type: stat, label: dns, value: "12", unit: ms, status: ok }
          - { type: stat, label: office vpn, value: "212", unit: ms, status: warn }
      - type: series
