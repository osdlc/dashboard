[package]
name = "dashboard-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The dashboard as a desktop app: a window, wallpaper or screensaver"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
dashboard-config = { version = "0.7.0", path = "../../crates/config" }
# Not used directly: its default features put every built-in module in the app.
dashboard-modules = { version = "0.7.0", path = "../../crates/modules" }
dashboard-runtime = { version = "0.7.0", path = "../../crates/runtime" }
dashboard-web = { version = "0.7.0", path = "../../crates/web" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
