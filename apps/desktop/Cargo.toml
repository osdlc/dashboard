[package]
name = "sitroom-desktop"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sitroom as a desktop app: a window, wallpaper or screensaver"
# Built and bundled with Tauri (docs/desktop.md), not installed with cargo.
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
sitroom-core = { version = "0.8.0", path = "../../crates/core" }
# The runtime, and with its default features every built-in module.
sitroom-modules = { version = "0.8.0", path = "../../crates/modules" }
sitroom-web = { version = "0.8.0", path = "../../crates/web" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
