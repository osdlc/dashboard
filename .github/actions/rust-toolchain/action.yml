# Installs a Rust toolchain with rustup and makes it the toolchain for every
# later step of the job (RUSTUP_TOOLCHAIN in GITHUB_ENV).
#
# With no `toolchain` input it installs the pin in rust-toolchain.toml.
# RUSTUP_TOOLCHAIN overrides that file, so a job that passes another
# toolchain gets that one. Every GitHub-hosted runner ships rustup, so no
# third-party action is needed. The same action as osdlc/skillwright's, with
# the toolchain file at the repository root.
name: rust-toolchain
description: Install a Rust toolchain and select it for the rest of the job.

inputs:
  toolchain:
    description: Toolchain to install, for example 1.98.0 or nightly. Empty means the pin in rust-toolchain.toml.
    required: false
    default: ''
  components:
    description: Space-separated rustup components, for example "rustfmt clippy".
    required: false
    default: ''
  targets:
    description: Space-separated extra targets.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install the toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        tc="$TOOLCHAIN"
        if [ -z "$tc" ]; then
          tc="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        fi
        if [ -z "$tc" ]; then
          echo "::error::no toolchain input and no channel in rust-toolchain.toml"
          exit 1
        fi
        args=(--profile minimal --no-self-update)
        for c in $COMPONENTS; do args+=(--component "$c"); done
        for t in $TARGETS; do args+=(--target "$t"); done
        rustup toolchain install "$tc" "${args[@]}"
        echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
        RUSTUP_TOOLCHAIN="$tc" rustc --version
