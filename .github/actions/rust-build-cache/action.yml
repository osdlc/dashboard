# Caches ~/.cargo and target/ between runs. Swatinem/rust-cache puts the job
# id and the runner OS in the key, so each job has its own entry.
name: rust-build-cache
description: Cache cargo downloads and the target directory.

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Save only on main, so pull requests read the cache but do not fill
        # it with one-off entries.
        save-if: ${{ github.ref == 'refs/heads/main' }}
