# Publishes every crate to crates.io when a version tag (v0.9.0) is pushed.
# The steps are the ones in docs/releasing.md.
#
# Auth is trusted publishing: crates.io trades the job's OIDC token for a
# short-lived publish token, so no token is stored here. crates.io allows
# that only for a crate that exists, so the first release uses an API token
# instead: the CARGO_REGISTRY_TOKEN secret of the `crates-io` environment.
# When that secret is set it is used; when it isn't, OIDC is. After the first
# release, add a trusted publisher to each crate on crates.io (repository
# osdlc/sitroom, workflow release.yml, environment crates-io) and delete the
# secret. docs/releasing.md has the steps.
#
# Prerequisite, created by the owner: the `crates-io` environment (Settings,
# Environments), with a required reviewer and a deployment rule for `v*`
# tags, so a release waits for approval.
#
# A manual run (workflow_dispatch) is a dry run: it packs and builds every
# crate and uploads nothing.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The crates with publish = false, left out by name as in rust-ci.yml.
  UNPUBLISHED: --exclude sitroom-desktop --exclude sitroom-native --exclude sitroom-bench

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      # Set only for the first release (see the header).
      FIRST_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag must name the workspace version: v0.9.0 for version = "0.9.0".
      - name: The tag matches the version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml has version $version"
            exit 1
          fi

      - uses: osdlc/osdlc/.github/actions/rust-toolchain@8a0f1f09e91423444b6d317a4abac05edc74c5ae # as rust-ci.yml
        with:
          workspace: .

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The published sitroom-web carries the built UI in ui/.
      - name: Build the UI
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          rm -rf crates/web/ui && cp -r web/dist crates/web/ui

      # --allow-dirty is for the git-ignored crates/web/ui only: nothing else
      # may have changed (the UI build must not touch tracked files).
      - name: Only the UI is new
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::the checkout changed while building the UI"
            exit 1
          fi

      # crates/web/ui is git-ignored, so cargo counts it as uncommitted.
      - name: Dry run
        run: cargo publish --workspace --locked --allow-dirty --dry-run $UNPUBLISHED

      # Trusted publishing, unless the first-release token is set.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: github.event_name == 'push' && env.FIRST_RELEASE_TOKEN == ''
        id: auth

      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.FIRST_RELEASE_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --workspace --locked --allow-dirty --no-verify $UNPUBLISHED
