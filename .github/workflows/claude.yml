# Mention @claude in a pull request comment, an inline review comment or a
# review and Claude replies on the pull request: an answer, a review
# (`@claude review [focus]`), or a skill (`@claude /<plugin>:<skill> [args]`,
# with `--apply` to push its edits). The work is osdlc/osdlc's claude.yml,
# called here; this file only says when it runs. See
# packages/gh-actions/claude-pr/README.md in osdlc/osdlc.
#
# Settings are this repository's (or the organization's) variables:
# PR_AGENT_TRIGGER_USERS (who may call it) and PR_AGENT_APP_CLIENT_ID (the App
# that pushes --apply commits). Secrets: ANTHROPIC_API_KEY and
# PR_AGENT_APP_PRIVATE_KEY, passed by `secrets: inherit`. Only a trigger user's
# comment starts a runner.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: osdlc/osdlc/.github/workflows/claude.yml@472b898782005d32fd9cb0074b73b1e285d636c1 # osdlc/osdlc#764; @main once merged
    secrets: inherit
