# Keeps open pull requests up to date with main: merges main into each open PR
# branch, with a claude repair for conflicts. The work is osdlc/osdlc's
# pr-update.yml, called here; this file only says when it runs. See
# packages/gh-actions/pr-update/README.md in osdlc/osdlc.
#
#   schedule            once a night
#   workflow_dispatch   all PRs now, or one PR (input `pr`); `dry-run` pushes nothing
#   issue_comment       `/pr-update` or `/pr-update retry` as the first line of
#                       a PR comment from a trigger user: that PR now
#
# Settings are this repository's (or the organization's) variables:
# RELEASE_PLZ_APP_CLIENT_ID (the osdlc-release App) and
# PR_UPDATE_TRIGGER_USERS. Secrets: RELEASE_PLZ_APP_PRIVATE_KEY and
# ANTHROPIC_API_KEY, passed by `secrets: inherit`.
name: pr-update

on:
  schedule:
    - cron: "30 8 * * *" # 02:30 US Central standard time, 03:30 daylight
  workflow_dispatch:
    inputs:
      pr:
        description: One PR number to update. Empty updates every eligible PR.
        required: false
        default: ""
      dry-run:
        description: Measure and report, push nothing.
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr-update:
    permissions:
      contents: read
    uses: osdlc/osdlc/.github/workflows/pr-update.yml@main
    secrets: inherit
