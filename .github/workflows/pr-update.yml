# Keeps open pull requests up to date with main. Every merge to main puts each
# open PR one commit further behind; this brings them forward by merging main
# into the PR branch (no force-push; squash-merge the PR and the merge commit
# never reaches main). A conflict the built-in resolvers cannot clear goes to a
# headless claude repair; one it cannot clear either is labelled
# needs-manual-update and commented on once.
#
# This file only says when it runs and for whom. The work is the reusable
# workflow pr-update-reusable.yml in osdlc/osdlc; it describes the gate, the
# concurrency groups and the App token, and
# packages/gh-actions/pr-update/README.md there describes the action.
#
# When it runs
#   schedule            once a night, see the cron below. Not on every push to
#                       main: each merge to main would push a merge commit to
#                       every open PR, and each push starts that PR's CI.
#   workflow_dispatch   all PRs now, or one PR (input `pr`); `dry-run` pushes nothing
#   issue_comment       `/pr-update` or `/pr-update retry` as the first line of
#                       a PR comment from a trigger user: that PR now
#
# Token: the pushes are made as the osdlc-release GitHub App, which must be
# installed on this repository. Its private key is the secret
# RELEASE_PLZ_APP_PRIVATE_KEY (repository or organization).
name: pr-update

on:
  schedule:
    - cron: "30 8 * * *" # 02:30 US Central standard time, 03:30 daylight
  workflow_dispatch:
    inputs:
      pr:
        description: One PR number to update. Empty updates every eligible PR.
        required: false
        default: ""
      dry-run:
        description: Measure and report, push nothing.
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr-update:
    # Not in a fork, where the schedule would run without the App.
    if: github.repository == 'osdlc/dashboard'
    permissions:
      contents: read
    uses: osdlc/osdlc/.github/workflows/pr-update-reusable.yml@main
    with:
      app-client-id: Iv23liYTGAl78fzN8YWm
      pr: ${{ inputs.pr }}
      dry-run: ${{ inputs.dry-run == true }}
      trigger-users: sksizer
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
