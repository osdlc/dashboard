# Rust CI for the workspace, and for the web view and SDK types generated from
# it. Shaped after rust-ci.yml in osdlc/osdlc and rust.yml in
# osdlc/skillwright.
#
# Unlike upstream there is no `changes` job: the Rust tests read files from
# most top-level folders, so nearly every pull request touches something they
# check. Left out on purpose: no crate here is published to crates.io, so there
# is no `cargo package`, release-plz or semver job, and with no `rust-version`
# in Cargo.toml there is no MSRV or minimal-versions job.
#
# Plain `cargo test` covers the workspace's default members, which leave out
# the Tauri desktop app (it needs WebKitGTK on Linux; see docs/desktop.md).
#
# Every action is pinned to a commit SHA; the comment names its release.
name: rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # The web job builds the Vue app; the other jobs embed a placeholder page.
  DASHBOARD_SKIP_UI_BUILD: '1'

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  rust-test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - uses: ./.github/actions/rust-build-cache

      # The plugin tests run the TypeScript and Python plugins in plugins/ext
      # and skip any whose interpreter is missing (Node 24 runs main.ts
      # directly). Fail here instead, so their Node and Python runs are never
      # skipped. Bun is optional and not installed: the SDK example tests run
      # the TypeScript examples under Node either way.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: The plugin interpreters are installed
        run: |
          set -euo pipefail
          node --version
          python3 --version

      # Per OS, because code behind `cfg(unix)` and `cfg(target_os)` is only
      # linted on that OS.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # Runs scripts/check-features.sh --bundles (see its header). The per-module
  # builds (the script without --bundles) are left to a local run.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/rust-build-cache

      # The same interpreters as rust-test: the script runs the plugin tests
      # in each bundle, and the runner's own Node is older than 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: The plugin interpreters are installed
        run: |
          node --version
          python3 --version

      - name: Each bundle on its own
        run: scripts/check-features.sh --bundles

      # The script's cargo commands don't pass --locked.
      - name: Cargo.lock is unchanged
        run: git diff --exit-code -- Cargo.lock

  # Runs the web tests and build, and checks that every file generated from the
  # Rust contract (the web view's types and themes, both SDKs' types) is
  # current.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/rust-build-cache

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build (type check and bundle)
        working-directory: web
        run: pnpm build

      # `gen-types.mjs --check` fails on a stale SDK file itself and writes
      # nothing, so only web/src (and Cargo.lock, which these cargo runs could
      # update without --locked) can show a diff.
      - name: The generated files are current
        run: |
          (cd web && pnpm gen:types && pnpm gen:themes)
          node sdk/gen-types.mjs --check
          if ! git diff --quiet -- web/src Cargo.lock; then
            git --no-pager diff --stat -- web/src Cargo.lock
            git --no-pager diff -- web/src | head -60 || true
            echo "::error::generated files differ from the Rust contract. Run 'cd web && pnpm gen:types && pnpm gen:themes' and commit the result."
            exit 1
          fi

  # Not in the `rust` gate until it passes and stays green (status:
  # docs/windows.md); then move it into the rust-test matrix.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - uses: ./.github/actions/rust-build-cache

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The job to require in the "Protect main" ruleset. It passes when every job
  # it needs passed or was skipped. `!cancelled()` rather than `always()`: a
  # run superseded by a newer push is cancelled, and should not report a
  # failure; a job that fails or times out still fails it.
  rust:
    needs: [lint, rust-test, features, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every Rust job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a Rust job ended with: $r"; exit 1 ;;
            esac
          done
