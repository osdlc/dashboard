# Rust CI for the workspace, and for the web view and SDK types generated from
# it.
#
# The format check, clippy and the tests on Linux and macOS, and the
# non-gating Windows run are the `core` job: a call of osdlc/osdlc's
# rust-ci-core.yml (packages/gh-actions/README.md there lists its settings).
# Its checks report as `core / <job>`. `features` and `web` are this
# repository's own. The Rust actions they use come from the same osdlc/osdlc
# commit as the workflow; move the pins together.
#
# The pins are a commit on osdlc/osdlc main (#867's merge). Pin only to
# commits on main: a pull request's head commit stops resolving once the
# pull request is squash-merged and its branch deleted, and every run then
# fails before it starts ("workflow file issue").
#
# Unlike upstream there is no `changes` job: the Rust tests read files from
# most top-level folders, so nearly every pull request touches something they
# check. The `web` job also packs the crates as crates.io would get them and
# builds each from its packed copy (docs/releasing.md).
#
# Plain `cargo test` covers the workspace's default members, which leave out
# the Tauri desktop app (it needs WebKitGTK on Linux; see docs/desktop.md) and
# the GPUI app (the `native` job).
#
# Every action is pinned to a commit SHA; the comment names its release.
name: rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # The web job builds the Vue app; the other jobs embed a placeholder page.
  SITROOM_SKIP_UI_BUILD: '1'

defaults:
  run:
    shell: bash

jobs:
  core:
    uses: osdlc/osdlc/.github/workflows/rust-ci-core.yml@2419043759e28780926a0871dea3c170b7039e5a # osdlc/osdlc main, PR #867 merged
    with:
      # Plain `cargo test` covers the default members, which leave out the
      # Tauri desktop app (see the header).
      packages: default
      os: ubuntu-latest macos-latest
      # Not in the `rust` gate until it passes and stays green (status:
      # docs/windows.md); then add windows-latest to `os`.
      windows: 'true'
      timeout: '40'
      # The plugin tests run the TypeScript and Python plugins in plugins/ext
      # and skip any whose interpreter is missing (Node 24 runs main.ts
      # directly). The setup fails instead, so their Node and Python runs are
      # never skipped. Bun is optional and not installed: the SDK example
      # tests run the TypeScript examples under Node either way. Not checked on
      # Windows, whose job never checked them.
      node-version: '24'
      setup: node --version && if [ "$RUNNER_OS" != Windows ]; then python3 --version; fi
      # The web job builds the Vue app; the other jobs embed a placeholder page.
      env: |
        SITROOM_SKIP_UI_BUILD=1

  # The GPUI app (apps/native), on macOS only for now: on Linux it needs
  # fontconfig, X11 and Wayland headers, which no job installs yet.
  native:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: osdlc/osdlc/.github/actions/rust-toolchain@2419043759e28780926a0871dea3c170b7039e5a # as `core`
        with:
          workspace: .
          components: clippy

      - uses: osdlc/osdlc/.github/actions/rust-build-cache@2419043759e28780926a0871dea3c170b7039e5a # as `core`
        with:
          workspace: .

      - name: Clippy
        run: cargo clippy -p sitroom-native --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p sitroom-native --locked

  # Runs scripts/check-features.sh --bundles (see its header). The per-module
  # builds (the script without --bundles) are left to a local run.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: osdlc/osdlc/.github/actions/rust-toolchain@2419043759e28780926a0871dea3c170b7039e5a # as `core`
        with:
          workspace: .

      - uses: osdlc/osdlc/.github/actions/rust-build-cache@2419043759e28780926a0871dea3c170b7039e5a # as `core`
        with:
          workspace: .

      # The same interpreters as `core`: the script runs the plugin tests
      # in each bundle, and the runner's own Node is older than 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: The plugin interpreters are installed
        run: |
          node --version
          python3 --version

      - name: Each bundle on its own
        run: scripts/check-features.sh --bundles

      # The script's cargo commands don't pass --locked.
      - name: Cargo.lock is unchanged
        run: git diff --exit-code -- Cargo.lock

  # Runs the web tests and build, and checks that every file generated from the
  # Rust contract (the web view's types and themes, both SDKs' types) is
  # current.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: osdlc/osdlc/.github/actions/rust-toolchain@2419043759e28780926a0871dea3c170b7039e5a # as `core`
        with:
          workspace: .

      - uses: osdlc/osdlc/.github/actions/rust-build-cache@2419043759e28780926a0871dea3c170b7039e5a # as `core`
        with:
          workspace: .

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build (type check and bundle)
        working-directory: web
        run: pnpm build

      # Every crate as crates.io would get it, built from its packed copy:
      # a file one embeds from outside its folder fails here. The same script
      # as a release (docs/releasing.md), with the UI built above.
      - name: Package the crates
        env:
          SITROOM_UI_BUILT: '1'
        run: scripts/crates.sh package

      # `gen-types.mjs --check` fails on a stale SDK file itself and writes
      # nothing, so only web/src (and Cargo.lock, which these cargo runs could
      # update without --locked) can show a diff.
      - name: The generated files are current
        run: |
          (cd web && pnpm gen:types && pnpm gen:themes)
          node sdk/gen-types.mjs --check
          if ! git diff --quiet -- web/src Cargo.lock; then
            git --no-pager diff --stat -- web/src Cargo.lock
            git --no-pager diff -- web/src | head -60 || true
            echo "::error::generated files differ from the Rust contract. Run 'cd web && pnpm gen:types && pnpm gen:themes' and commit the result."
            exit 1
          fi

  # The job to require in the "Protect main" ruleset. It passes when every job
  # it needs passed or was skipped. `!cancelled()` rather than `always()`: a
  # run superseded by a newer push is cancelled, and should not report a
  # failure; a job that fails or times out still fails it.
  rust:
    needs: [core, native, features, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every Rust job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a Rust job ended with: $r"; exit 1 ;;
            esac
          done
