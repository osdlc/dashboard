# Checks the Cargo workspace on every pull request and push to main: format,
# clippy and tests on Linux and macOS, the feature-gated bundles each on their
# own, and the web view and SDK types that are generated from the Rust
# contract. Shaped after rust-ci.yml in osdlc/osdlc and rust.yml in
# osdlc/skillwright.
#
# The final `rust` job always reports, and it is the one to require in the
# "Protect main" ruleset. It passes when every job it needs passed or was
# skipped. Unlike upstream there is no `changes` job: the Rust tests read
# docs/, examples/, marketplace/, plugins/, sdk/, site/src/data/ and web/, so
# nearly every pull request touches something they check.
#
# Left out on purpose, compared with upstream: no crate here is published to
# crates.io, so there is no `cargo package`, release-plz or semver job, and
# with no `rust-version` in Cargo.toml there is no MSRV or minimal-versions
# job. Windows runs but does not gate (docs/windows.md: never run there yet).
#
# The toolchain is the pin in rust-toolchain.toml. Plain `cargo test` covers
# the workspace's default members, which leave out the Tauri desktop app (it
# needs WebKitGTK on Linux; see docs/desktop.md).
#
# Every action is pinned to a commit SHA; the comment names its release.
name: rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # The web job builds the Vue app; the other jobs embed a placeholder page.
  DASHBOARD_SKIP_UI_BUILD: '1'

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  rust-test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - uses: ./.github/actions/rust-build-cache

      # The plugin tests run the TypeScript and Python plugins in plugins/ext
      # and skip any whose interpreter is missing (Node 24 runs main.ts
      # directly). Fail here instead, so CI never passes on skipped tests.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: The plugin interpreters are installed
        run: |
          set -euo pipefail
          node --version
          python3 --version

      # Per OS, because code behind `cfg(unix)` and `cfg(target_os)` is only
      # linted on that OS.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # Builds and tests the binary with no built-in modules and with each bundle
  # on its own, so a bundle never depends on another by accident. The
  # per-module builds (the script without --bundles) are left to a local run.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/rust-build-cache
        with:
          key: features

      - name: Each bundle on its own
        run: scripts/check-features.sh --bundles

  # The web view is embedded in the binary, and its contract types, its color
  # themes and both SDKs' types are generated from the Rust contract. This
  # job runs the web tests, builds it as `cargo build` would, and checks that
  # every generated file is what its generator writes now.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/rust-build-cache

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build (type check and bundle)
        working-directory: web
        run: pnpm build

      - name: The generated files are current
        run: |
          set -euo pipefail
          (cd web && pnpm gen:types && pnpm gen:themes)
          node sdk/gen-types.mjs --check
          if [ -n "$(git status --porcelain -- web/src sdk)" ]; then
            git status --short -- web/src sdk
            git diff -- web/src sdk | head -60
            echo "::error::generated files differ from the Rust contract. Run 'cd web && pnpm gen:types && pnpm gen:themes' and 'node sdk/gen-types.mjs', and commit the result."
            exit 1
          fi

  # The first runs on Windows (docs/windows.md: built only by cross-compiling
  # so far). Not in the `rust` gate until it passes and stays green; then
  # move it into the rust-test matrix.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - uses: ./.github/actions/rust-build-cache

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  rust:
    needs: [lint, rust-test, features, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Rust job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a Rust job ended with: $r"; exit 1 ;;
            esac
          done
