[package]
name = "dashboard-bench"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# The native-vs-plugin benchmark: startup, render latency, memory and CPU of
# each benchmark widget, built in and as a plugin. See bench/README.md.
[dependencies]
anyhow = "1.0.104"
dashboard-contract = { version = "0.6.0", path = "../crates/contract" }
dashboard-modules = { version = "0.6.0", path = "../crates/modules" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
