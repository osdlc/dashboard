# sitroom-modules' own `common` source, built against the stand-in for
# sitroom-core's `host`.
[package]
name = "bench-wasm-common"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "../../../crates/modules/src/common/mod.rs"

[features]
# Never on: the HTTP client does not build for WASI.
http = []

[dependencies]
anyhow = "1.0.104"
sitroom-contract = { path = "../../../crates/contract" }
sitroom-core = { path = "../host", package = "bench-wasm-host" }
schemars = "1.2.3"
serde_json = "1.0.154"
