[workspace]
resolver = "3"
members = ["crates/*", "bench", "apps/*"]
# Plain `cargo build` / `cargo test` leave out the desktop app (Tauri: slow to
# build, and on Linux it needs WebKitGTK). `--workspace` or `-p` include it.
default-members = ["crates/*", "bench"]
# Plugins in other languages and the WASM plugins (the native-vs-plugin
# benchmark): not workspace crates.
exclude = ["plugins/ext", "bench/wasm"]

[workspace.package]
edition = "2024"
version = "0.9.0"
# The MSRV: sysinfo needs 1.95, the highest of any dependency.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/osdlc/sitroom"
homepage = "https://osdlc.github.io/sitroom/"

# osdlc's Rust package standard (S-package-shape-rs). Unsafe code is denied
# rather than forbidden: the few places that call the OS allow it where they
# do, with a SAFETY comment.
[workspace.lints.rust]
unsafe_code = "deny"

# The release binaries (release.yml): optimised and stripped, panics still
# unwind (a module's panic stays in its task).
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

# Smallest binary: `cargo build --profile small`. Slower to build.
[profile.small]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
