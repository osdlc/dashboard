[package]
name = "sitroom-tui"
description = "Sitroom's terminal renderer, built on ratatui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
sitroom-contract = { version = "0.9.0", path = "../contract" }
sitroom-core = { version = "0.9.0", path = "../core" }
# Decoders for the image widget: the formats it documents, nothing more.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui = "0.30.2"
# Draws the image widget; see crates/tui/src/images.rs.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.54.1", features = ["full"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
sitroom-modules = { path = "../modules" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[lints]
workspace = true
