[package]
name = "sitroom"
description = "Sitroom command: the TUI, the web view, config, packages and the plugin tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["dashboard", "tui", "terminal", "monitoring", "developer-tools"]
categories = ["command-line-utilities", "visualization", "development-tools"]
# Two programs: `sitroom` and `sit`, its short name (src/bin/sit.rs).
default-run = "sitroom"

# Which built-in modules the binary includes: a bundle, or one module. Same
# names as on sitroom-modules. See docs/modules.md.
[features]
default = [
    "bundle-system",
    "bundle-dev",
    "bundle-ops",
    "bundle-fun",
    "bundle-agents",
    "bundle-personal",
]
# Each bundle turns on its module features here too, so cfg(feature = "module-x")
# works in this crate's tests.
bundle-system = [
    "sitroom-modules/bundle-system",
    "module-cpu",
    "module-memory",
    "module-gpu",
    "module-network",
    "module-disk",
    "module-processes",
    "module-process",
    "module-log",
    "module-uptime",
    "module-textfile",
    "module-battery",
    "module-cmdrunner",
    "module-security",
    "module-http",
    "module-file",
    "module-screensaver",
]
bundle-dev = [
    "sitroom-modules/bundle-dev",
    "module-github-prs",
    "module-github-issues",
    "module-jira",
    "module-linear",
    "module-forgejo",
    "module-git",
]
bundle-ops = [
    "sitroom-modules/bundle-ops",
    "module-docker",
    "module-kubernetes",
    "module-ipinfo",
    "module-pihole",
    "module-transmission",
]
bundle-fun = [
    "sitroom-modules/bundle-fun",
    "module-demo",
    "module-clock",
    "module-hackernews",
    "module-feedreader",
    "module-subreddit",
    "module-devto",
    "module-mempool",
    "module-crypto",
    "module-scores",
]
bundle-agents = [
    "sitroom-modules/bundle-agents",
    "module-codex",
    "module-copilot",
    "module-cursor",
    "module-antigravity",
    "module-gemini",
    "module-opencode",
    "module-pi",
    "module-cswap",
]
bundle-personal = [
    "sitroom-modules/bundle-personal",
    "module-weather",
    "module-todo",
    "module-lunar",
    "module-calendar",
    "module-org-agenda",
    "module-markdown-tasks",
    "module-todo-txt",
    "module-taskwarrior",
    "module-sdlc",
]
module-cpu = ["sitroom-modules/module-cpu"]
module-memory = ["sitroom-modules/module-memory"]
module-gpu = ["sitroom-modules/module-gpu"]
module-network = ["sitroom-modules/module-network"]
module-disk = ["sitroom-modules/module-disk"]
module-processes = ["sitroom-modules/module-processes"]
module-process = ["sitroom-modules/module-process"]
module-log = ["sitroom-modules/module-log"]
module-uptime = ["sitroom-modules/module-uptime"]
module-textfile = ["sitroom-modules/module-textfile"]
module-battery = ["sitroom-modules/module-battery"]
module-cmdrunner = ["sitroom-modules/module-cmdrunner"]
module-security = ["sitroom-modules/module-security"]
module-http = ["sitroom-modules/module-http"]
module-file = ["sitroom-modules/module-file"]
module-screensaver = ["sitroom-modules/module-screensaver"]
module-github-prs = ["sitroom-modules/module-github-prs"]
module-github-issues = ["sitroom-modules/module-github-issues"]
module-jira = ["sitroom-modules/module-jira"]
module-linear = ["sitroom-modules/module-linear"]
module-forgejo = ["sitroom-modules/module-forgejo"]
module-git = ["sitroom-modules/module-git"]
module-demo = ["sitroom-modules/module-demo"]
module-clock = ["sitroom-modules/module-clock"]
module-hackernews = ["sitroom-modules/module-hackernews"]
module-feedreader = ["sitroom-modules/module-feedreader"]
module-subreddit = ["sitroom-modules/module-subreddit"]
module-devto = ["sitroom-modules/module-devto"]
module-mempool = ["sitroom-modules/module-mempool"]
module-crypto = ["sitroom-modules/module-crypto"]
module-scores = ["sitroom-modules/module-scores"]
module-codex = ["sitroom-modules/module-codex"]
module-copilot = ["sitroom-modules/module-copilot"]
module-cursor = ["sitroom-modules/module-cursor"]
module-antigravity = ["sitroom-modules/module-antigravity"]
module-gemini = ["sitroom-modules/module-gemini"]
module-opencode = ["sitroom-modules/module-opencode"]
module-pi = ["sitroom-modules/module-pi"]
module-cswap = ["sitroom-modules/module-cswap"]
module-docker = ["sitroom-modules/module-docker"]
module-kubernetes = ["sitroom-modules/module-kubernetes"]
module-ipinfo = ["sitroom-modules/module-ipinfo"]
module-pihole = ["sitroom-modules/module-pihole"]
module-transmission = ["sitroom-modules/module-transmission"]
module-weather = ["sitroom-modules/module-weather"]
module-todo = ["sitroom-modules/module-todo"]
module-lunar = ["sitroom-modules/module-lunar"]
module-calendar = ["sitroom-modules/module-calendar"]
module-org-agenda = ["sitroom-modules/module-org-agenda"]
module-markdown-tasks = ["sitroom-modules/module-markdown-tasks"]
module-todo-txt = ["sitroom-modules/module-todo-txt"]
module-taskwarrior = ["sitroom-modules/module-taskwarrior"]
module-sdlc = ["sitroom-modules/module-sdlc"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
sitroom-core = { version = "0.9.0", path = "../core" }
sitroom-contract = { version = "0.9.0", path = "../contract" }
sitroom-modules = { version = "0.9.0", path = "../modules", default-features = false }
sitroom-tui = { version = "0.9.0", path = "../tui" }
sitroom-web = { version = "0.9.0", path = "../web" }
etag-write = "0.2.4"
flate2 = "1.1.10"
path-guard = "0.3.2"
reqwest = "0.13.5"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
