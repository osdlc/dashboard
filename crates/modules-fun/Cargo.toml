[package]
name = "dashboard-modules-fun"
edition.workspace = true
version.workspace = true
license.workspace = true

# One feature per module, named after its id. dashboard-modules turns them on
# through its `bundle-fun` and `module-<id>` features.
[features]
default = ["demo"]
demo = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dashboard-contract = { version = "0.4.0", path = "../contract" }
dashboard-host = { version = "0.4.0", path = "../host" }
dashboard-modules-common = { version = "0.4.0", path = "../modules-common" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
