[package]
name = "dashboard-modules"
edition.workspace = true
version.workspace = true
license.workspace = true

# Built-in modules come in bundles, one crate each. A `bundle-<name>` feature
# turns on every module of that bundle; a `module-<id>` feature turns on one.
# See docs/modules.md.
[features]
default = [
    "bundle-system",
    "bundle-dev",
    "bundle-ops",
    "bundle-fun",
    "bundle-agents",
    "bundle-personal",
]
bundle-system = [
    "module-cpu",
    "module-memory",
    "module-network",
    "module-disk",
    "module-processes",
    "module-log",
    "module-uptime",
    "module-screensaver",
]
bundle-dev = [
    "module-github-prs",
    "module-github-issues",
    "module-jira",
    "module-linear",
    "module-forgejo",
]
# No modules yet.
bundle-ops = []
bundle-fun = ["module-demo"]
bundle-agents = ["module-codex", "module-copilot"]
# No modules yet.
bundle-personal = []

module-cpu = ["dashboard-modules-system/cpu"]
module-memory = ["dashboard-modules-system/memory"]
module-network = ["dashboard-modules-system/network"]
module-disk = ["dashboard-modules-system/disk"]
module-processes = ["dashboard-modules-system/processes"]
module-log = ["dashboard-modules-system/log"]
module-uptime = ["dashboard-modules-system/uptime"]
module-screensaver = ["dashboard-modules-system/screensaver"]
module-github-prs = ["dashboard-modules-dev/github-prs"]
module-github-issues = ["dashboard-modules-dev/github-issues"]
module-jira = ["dashboard-modules-dev/jira"]
module-linear = ["dashboard-modules-dev/linear"]
module-forgejo = ["dashboard-modules-dev/forgejo"]
module-demo = ["dashboard-modules-fun/demo"]
module-codex = ["dashboard-modules-agents/codex"]
module-copilot = ["dashboard-modules-agents/copilot"]

[dependencies]
dashboard-contract = { version = "0.4.0", path = "../contract" }
dashboard-host = { version = "0.4.0", path = "../host" }
dashboard-modules-common = { version = "0.4.0", path = "../modules-common" }
dashboard-modules-agents = { version = "0.4.0", path = "../modules-agents", default-features = false, optional = true }
dashboard-modules-dev = { version = "0.4.0", path = "../modules-dev", default-features = false, optional = true }
dashboard-modules-fun = { version = "0.4.0", path = "../modules-fun", default-features = false, optional = true }
dashboard-modules-system = { version = "0.4.0", path = "../modules-system", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.154"
