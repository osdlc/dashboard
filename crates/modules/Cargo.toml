[package]
name = "sitroom-modules"
description = "Gathers sitroom's built-in modules from the bundles this build includes"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# Built-in modules come in bundles, one crate each. A `bundle-<name>` feature
# turns on every module of that bundle; a `module-<id>` feature turns on one.
# See docs/modules.md.
[features]
default = [
    "bundle-system",
    "bundle-dev",
    "bundle-ops",
    "bundle-fun",
    "bundle-agents",
    "bundle-personal",
]
bundle-system = [
    "module-cpu",
    "module-memory",
    "module-gpu",
    "module-network",
    "module-disk",
    "module-processes",
    "module-process",
    "module-log",
    "module-uptime",
    "module-textfile",
    "module-battery",
    "module-cmdrunner",
    "module-security",
    "module-http",
    "module-file",
    "module-screensaver",
]
bundle-dev = [
    "module-github-prs",
    "module-github-issues",
    "module-jira",
    "module-linear",
    "module-forgejo",
    "module-git",
]
bundle-ops = [
    "module-docker",
    "module-kubernetes",
    "module-ipinfo",
    "module-pihole",
    "module-transmission",
]
bundle-fun = [
    "module-demo",
    "module-clock",
    "module-hackernews",
    "module-feedreader",
    "module-subreddit",
    "module-devto",
    "module-mempool",
    "module-crypto",
    "module-scores",
]
bundle-agents = [
    "module-codex",
    "module-copilot",
    "module-cursor",
    "module-antigravity",
    "module-gemini",
    "module-opencode",
    "module-pi",
]
bundle-personal = [
    "module-weather",
    "module-todo",
    "module-lunar",
    "module-calendar",
    "module-org-agenda",
    "module-markdown-tasks",
    "module-todo-txt",
    "module-taskwarrior",
    "module-sdlc",
]

module-cpu = ["sitroom-modules-system/cpu"]
module-memory = ["sitroom-modules-system/memory"]
module-gpu = ["sitroom-modules-system/gpu"]
module-network = ["sitroom-modules-system/network"]
module-disk = ["sitroom-modules-system/disk"]
module-processes = ["sitroom-modules-system/processes"]
module-process = ["sitroom-modules-system/process"]
module-log = ["sitroom-modules-system/log"]
module-uptime = ["sitroom-modules-system/uptime"]
module-textfile = ["sitroom-modules-system/textfile"]
module-battery = ["sitroom-modules-system/battery"]
module-cmdrunner = ["sitroom-modules-system/cmdrunner"]
module-security = ["sitroom-modules-system/security"]
module-http = ["sitroom-modules-system/http"]
module-file = ["sitroom-modules-system/file"]
module-screensaver = ["sitroom-modules-system/screensaver"]
module-github-prs = ["sitroom-modules-dev/github-prs"]
module-github-issues = ["sitroom-modules-dev/github-issues"]
module-jira = ["sitroom-modules-dev/jira"]
module-linear = ["sitroom-modules-dev/linear"]
module-forgejo = ["sitroom-modules-dev/forgejo"]
module-git = ["sitroom-modules-dev/git"]
module-demo = ["sitroom-modules-fun/demo"]
module-clock = ["sitroom-modules-fun/clock"]
module-hackernews = ["sitroom-modules-fun/hackernews"]
module-feedreader = ["sitroom-modules-fun/feedreader"]
module-subreddit = ["sitroom-modules-fun/subreddit"]
module-devto = ["sitroom-modules-fun/devto"]
module-mempool = ["sitroom-modules-fun/mempool"]
module-crypto = ["sitroom-modules-fun/crypto"]
module-scores = ["sitroom-modules-fun/scores"]
module-codex = ["sitroom-modules-agents/codex"]
module-copilot = ["sitroom-modules-agents/copilot"]
module-cursor = ["sitroom-modules-agents/cursor"]
module-antigravity = ["sitroom-modules-agents/antigravity"]
module-gemini = ["sitroom-modules-agents/gemini"]
module-opencode = ["sitroom-modules-agents/opencode"]
module-pi = ["sitroom-modules-agents/pi"]
module-docker = ["sitroom-modules-ops/docker"]
module-kubernetes = ["sitroom-modules-ops/kubernetes"]
module-ipinfo = ["sitroom-modules-ops/ipinfo"]
module-pihole = ["sitroom-modules-ops/pihole"]
module-transmission = ["sitroom-modules-ops/transmission"]
module-weather = ["sitroom-modules-personal/weather"]
module-todo = ["sitroom-modules-personal/todo"]
module-lunar = ["sitroom-modules-personal/lunar"]
module-calendar = ["sitroom-modules-personal/calendar"]
module-org-agenda = ["sitroom-modules-personal/org-agenda"]
module-markdown-tasks = ["sitroom-modules-personal/markdown-tasks"]
module-todo-txt = ["sitroom-modules-personal/todo-txt"]
module-taskwarrior = ["sitroom-modules-personal/taskwarrior"]
module-sdlc = ["sitroom-modules-personal/sdlc"]

[dependencies]
sitroom-contract = { version = "0.8.0", path = "../contract" }
sitroom-host = { version = "0.8.0", path = "../host" }
sitroom-modules-common = { version = "0.8.0", path = "../modules-common" }
sitroom-modules-agents = { version = "0.8.0", path = "../modules-agents", default-features = false, optional = true }
sitroom-modules-dev = { version = "0.8.0", path = "../modules-dev", default-features = false, optional = true }
sitroom-modules-ops = { version = "0.8.0", path = "../modules-ops", default-features = false, optional = true }
sitroom-modules-personal = { version = "0.8.0", path = "../modules-personal", default-features = false, optional = true }
sitroom-modules-fun = { version = "0.8.0", path = "../modules-fun", default-features = false, optional = true }
sitroom-modules-system = { version = "0.8.0", path = "../modules-system", default-features = false, optional = true }
serde_json = "1.0.154"

[lints]
workspace = true
