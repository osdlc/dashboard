[package]
name = "sitroom-modules"
description = "Sitroom's built-in modules, in bundles chosen with features, and the runtime that runs them from the config"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# A module-<id> feature per module, and a bundle-<name> feature per bundle
# (see docs/modules.md). Each module turns on its bundle's marker feature
# (system, dev, ...), which compiles that bundle's folder in src/.
[features]
default = [
    "bundle-system",
    "bundle-dev",
    "bundle-ops",
    "bundle-fun",
    "bundle-agents",
    "bundle-personal",
]
bundle-system = [
    "module-cpu",
    "module-memory",
    "module-gpu",
    "module-network",
    "module-disk",
    "module-processes",
    "module-process",
    "module-log",
    "module-uptime",
    "module-textfile",
    "module-battery",
    "module-cmdrunner",
    "module-security",
    "module-http",
    "module-file",
    "module-screensaver",
]
bundle-dev = [
    "module-github-prs",
    "module-github-issues",
    "module-jira",
    "module-linear",
    "module-forgejo",
    "module-git",
]
bundle-ops = [
    "module-docker",
    "module-kubernetes",
    "module-ipinfo",
    "module-pihole",
    "module-transmission",
]
bundle-fun = [
    "module-demo",
    "module-clock",
    "module-hackernews",
    "module-feedreader",
    "module-subreddit",
    "module-devto",
    "module-mempool",
    "module-crypto",
    "module-scores",
]
bundle-agents = [
    "module-codex",
    "module-copilot",
    "module-cursor",
    "module-antigravity",
    "module-gemini",
    "module-opencode",
    "module-pi",
    "module-cswap",
]
bundle-personal = [
    "module-weather",
    "module-todo",
    "module-lunar",
    "module-calendar",
    "module-org-agenda",
    "module-markdown-tasks",
    "module-todo-txt",
    "module-taskwarrior",
    "module-sdlc",
]

# Bundle markers.
system = []
dev = []
ops = []
fun = []
agents = []
personal = []
# reqwest, for the modules that call a web API.
http = ["dep:reqwest"]

# system
module-cpu = ["system", "dep:sysinfo"]
module-memory = ["system", "dep:sysinfo"]
module-gpu = ["system", "dep:sysinfo"]
module-network = ["system", "dep:sysinfo"]
module-disk = ["system", "dep:sysinfo"]
module-processes = ["system", "dep:sysinfo"]
module-process = ["system", "dep:sysinfo"]
module-log = ["system"]
module-uptime = ["system"]
module-textfile = ["system"]
module-battery = ["system"]
module-cmdrunner = ["system"]
module-security = ["system"]
module-http = ["system", "http"]
module-file = ["system", "dep:notify", "dep:tracing"]
module-screensaver = ["system"]
# dev
module-github-prs = ["dev"]
module-github-issues = ["dev"]
module-jira = ["dev", "http"]
module-linear = ["dev", "http"]
module-forgejo = ["dev", "http"]
module-git = ["dev"]
# ops
module-docker = ["ops"]
module-kubernetes = ["ops"]
module-ipinfo = ["ops", "http"]
module-pihole = ["ops", "http"]
module-transmission = ["ops", "http"]
# fun
module-demo = ["fun"]
module-clock = ["fun", "dep:jiff"]
module-hackernews = ["fun", "http"]
module-feedreader = ["fun", "http", "dep:reqwest", "dep:roxmltree"]
module-subreddit = ["fun", "http", "dep:roxmltree"]
module-devto = ["fun", "http"]
module-mempool = ["fun", "http"]
module-crypto = ["fun", "http"]
module-scores = ["fun", "http"]
# agents
module-codex = ["agents"]
module-copilot = ["agents", "http"]
module-cursor = ["agents", "http"]
module-antigravity = ["agents", "http"]
module-gemini = ["agents"]
module-opencode = ["agents"]
module-pi = ["agents"]
module-cswap = ["agents"]
# personal
module-weather = ["personal", "http"]
module-todo = ["personal", "dep:jiff"]
module-lunar = ["personal", "dep:jiff"]
module-calendar = ["personal", "http", "dep:jiff"]
module-org-agenda = ["personal", "dep:jiff"]
module-markdown-tasks = ["personal", "dep:jiff"]
module-todo-txt = ["personal", "dep:jiff"]
module-taskwarrior = ["personal", "dep:jiff"]
module-sdlc = ["personal", "dep:jiff", "dep:serde-saphyr"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
jiff = { version = "0.2.38", optional = true }
notify = { version = "8.2.1", optional = true, default-features = false, features = ["macos_kqueue"] }
reqwest = { version = "0.13.5", features = ["json", "query"], optional = true }
roxmltree = { version = "0.21.1", optional = true }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"], optional = true }
serde_json = "1.0.154"
sitroom-contract = { version = "0.9.0", path = "../contract" }
sitroom-core = { version = "0.9.0", path = "../core" }
sysinfo = { version = "0.39.6", optional = true }
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[lints]
workspace = true
