[package]
name = "dashboard-modules-dev"
edition.workspace = true
version.workspace = true
license.workspace = true

# One feature per module, named after its id. dashboard-modules turns them on
# through its `bundle-dev` and `module-<id>` features.
[features]
default = ["github-prs", "github-issues", "jira", "linear", "forgejo", "git"]
github-prs = []
github-issues = []
jira = ["http"]
linear = ["http"]
forgejo = ["http"]
git = []
# reqwest, for the trackers' web APIs.
http = ["dashboard-modules-common/http"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dashboard-contract = { version = "0.6.0", path = "../contract" }
dashboard-host = { version = "0.6.0", path = "../host" }
dashboard-modules-common = { version = "0.6.0", path = "../modules-common" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "process", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
