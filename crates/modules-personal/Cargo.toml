[package]
name = "dashboard-modules-personal"
edition.workspace = true
version.workspace = true
license.workspace = true

# One feature per module, named after its id. dashboard-modules turns them on
# through its `bundle-personal` and `module-<id>` features.
[features]
default = [
    "weather",
    "todo",
    "lunar",
    "calendar",
    "org-agenda",
    "markdown-tasks",
    "todo-txt",
    "taskwarrior",
    "sdlc",
]
weather = ["dashboard-modules-common/http"]
todo = ["dep:jiff"]
lunar = ["dep:jiff"]
# reqwest, to download .ics feeds; tokio, to run url_command.
calendar = ["dashboard-modules-common/http", "dep:jiff", "dep:tokio"]
org-agenda = ["dep:jiff"]
markdown-tasks = ["dep:jiff"]
todo-txt = ["dep:jiff"]
# tokio, to run `task export` with a time limit.
taskwarrior = ["dep:jiff", "dep:tokio"]
sdlc = ["dep:jiff", "dep:serde-saphyr"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dashboard-contract = { version = "0.5.0", path = "../contract" }
dashboard-host = { version = "0.5.0", path = "../host" }
dashboard-modules-common = { version = "0.5.0", path = "../modules-common" }
# Dates and time zones (the system's tz database; bundled on Windows).
jiff = { version = "0.2.38", optional = true }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"], optional = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "rt", "time"], optional = true }

[dev-dependencies]
dashboard-config = { version = "0.5.0", path = "../config" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt"] }
