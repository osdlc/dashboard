[package]
name = "dashboard-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

# Which built-in modules run is decided by the binary that links this crate:
# its features on dashboard-modules (see crates/cli/Cargo.toml).
[dependencies]
anyhow = "1.0.104"
dashboard-config = { version = "0.8.0", path = "../config" }
dashboard-contract = { version = "0.8.0", path = "../contract" }
dashboard-cswap = { version = "0.8.0", path = "../../plugins/cswap" }
dashboard-host = { version = "0.8.0", path = "../host" }
dashboard-modules = { version = "0.8.0", path = "../modules", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

