[package]
name = "sitroom-modules-agents"
description = "Sitroom modules for AI coding agents: limits, usage and cost"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# One feature per module, named after its id. sitroom-modules turns them on
# through its `bundle-agents` and `module-<id>` features.
[features]
default = ["codex", "copilot", "cursor", "antigravity", "gemini", "opencode", "pi"]
codex = []
copilot = ["sitroom-modules-common/http"]
cursor = ["sitroom-modules-common/http"]
antigravity = ["sitroom-modules-common/http"]
gemini = []
opencode = []
pi = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
sitroom-contract = { version = "0.8.0", path = "../contract" }
sitroom-host = { version = "0.8.0", path = "../host" }
sitroom-modules-common = { version = "0.8.0", path = "../modules-common" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "process", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
