[package]
name = "dashboard-web"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dashboard-cli-kit = { version = "0.6.0", path = "../cli-kit" }
dashboard-contract = { version = "0.6.0", path = "../contract" }
dashboard-host = { version = "0.6.0", path = "../host" }
futures-util = "0.3.34"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
