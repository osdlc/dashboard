[package]
name = "sitroom-modules-common"
description = "What sitroom's built-in module bundles share: registration, catalog helpers, times and HTTP"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# reqwest, for modules that call a web API.
http = ["dep:reqwest"]

[dependencies]
anyhow = "1.0.104"
sitroom-contract = { version = "0.8.0", path = "../contract" }
sitroom-host = { version = "0.8.0", path = "../host" }
reqwest = { version = "0.13.5", features = ["json", "query"], optional = true }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "test-util"] }

[lints]
workspace = true
